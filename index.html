<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>小沙弥静修 · 静照院</title>
<style>
  :root{
    --paper:#ece5d5; --paper-2:#dcd2ba; --ink:#2e3532; --ink-soft:#5d6158;
    --gold:#b49a68; --gold-lt:#d9c69b; --cinnabar:#96574c; --jade:#788b80;
    --paper-tex:url('assets/art/paper.png');
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  button,input,textarea{-webkit-appearance:none;appearance:none;outline:none;touch-action:manipulation}
  button:focus-visible,a:focus-visible{outline:2px solid var(--gold-lt);outline-offset:2px}
  button:active{filter:brightness(.94)}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b322f;color:var(--paper);
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","STSong","SimSun",serif;
    user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden;background:#b7bcb0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  /* 全屏宣纸颗粒 + 四角压暗，把 3D 与 UI 揉进同一张画里 */
  .grain{position:fixed;inset:0;z-index:12;pointer-events:none;
    background-image:var(--paper-tex);background-size:220px;
    mix-blend-mode:soft-light;opacity:.14}
  .vignette{position:fixed;inset:0;z-index:11;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,transparent 42%,rgba(38,34,26,.34) 100%)}
  /* 遮罩压在赐名卷轴之下：进庙第一眼就能看到法号，画面再从背后淡入 */
  #veil{position:fixed;inset:0;z-index:55;pointer-events:none;background:#2b322f;
    transition:opacity 1.5s ease}
  #veil.gone{opacity:0}

  /* ---------------- 左上：宣纸法号牌 + 三个数 ---------------- */
  .hud{position:fixed;left:24px;top:22px;z-index:20;width:224px;pointer-events:none;
    background-image:var(--paper-tex);background-color:rgba(239,230,209,.92);
    border:1px solid rgba(120,96,58,.5);border-radius:4px;
    box-shadow:0 10px 30px rgba(24,26,22,.32),inset 0 0 0 4px rgba(255,255,255,.22);
    color:var(--ink);padding:12px 14px 11px;
    animation:hudIn .9s cubic-bezier(.2,.9,.3,1) both}
  @keyframes hudIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .hud::before,.hud::after{content:'';position:absolute;left:8px;right:8px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(120,96,58,.45),transparent)}
  .hud::before{top:5px}.hud::after{bottom:5px}
  .dharma-row{display:flex;align-items:center;gap:10px;padding-bottom:9px;
    border-bottom:1px solid rgba(120,96,58,.3);margin-bottom:9px}
  .seal{flex:0 0 36px;width:36px;height:36px;border-radius:3px;background:var(--cinnabar);
    color:#f7ecd6;font-size:11px;line-height:1.15;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    box-shadow:inset 0 0 0 2px rgba(255,240,214,.5),0 2px 5px rgba(90,40,30,.28);
    transform:rotate(-3deg)}
  .dharma-txt small{display:block;font-size:10px;letter-spacing:3px;color:#8a7550;margin-bottom:1px}
  .dharma-txt b{display:block;font-size:23px;letter-spacing:5px;font-weight:normal;color:#2e2b26;
    line-height:1.15;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .dharma-wait{color:#9b8a68;letter-spacing:3px}
  .stats{display:flex;flex-direction:column;gap:5px}
  .stat{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;
    letter-spacing:2px;color:var(--ink-soft)}
  .stat b{font-size:14px;font-weight:normal;color:#5a4526;letter-spacing:1px;
    font-variant-numeric:tabular-nums}

  .tools{position:fixed;right:22px;top:22px;z-index:20;display:flex;gap:8px}
  .tools button{font:inherit;font-size:12px;letter-spacing:2px;color:#4a4234;cursor:pointer;
    height:44px;padding:0 14px;border-radius:22px;
    background-image:var(--paper-tex);background-color:rgba(240,230,208,.92);
    border:1px solid rgba(120,96,58,.5);transition:all .25s;line-height:1.25;
    box-shadow:0 6px 18px rgba(18,24,20,.22),inset 0 0 0 3px rgba(255,255,255,.2)}
  .tools button:hover{border-color:var(--cinnabar);transform:translateY(-2px)}

  /* ---------------- 右下角：木鱼 / 念珠 工具坞（不用在场景里找） ---------------- */
  .dock{position:fixed;right:22px;bottom:26px;z-index:22;display:flex;flex-direction:column;gap:10px}
  .dock-btn{display:flex;align-items:center;gap:10px;cursor:pointer;font:inherit;
    padding:9px 14px 9px 10px;border-radius:12px;color:var(--ink);
    background-image:var(--paper-tex);background-color:rgba(240,230,208,.94);
    border:1px solid rgba(120,96,58,.55);backdrop-filter:blur(8px);
    box-shadow:0 8px 22px rgba(12,14,12,.42),inset 0 0 0 3px rgba(255,255,255,.22);
    transition:transform .22s,border-color .22s,background-color .22s}
  .dock-btn:hover{transform:translateX(-4px);border-color:var(--cinnabar);
    background-color:rgba(244,232,206,.97)}
  .dock-btn svg{width:30px;height:30px;flex:0 0 30px;opacity:.95}
  .dock-btn .lbl{display:block;font-size:14px;letter-spacing:3px;color:#3a3020;line-height:1.2;font-weight:normal}
  .dock-btn .sub{display:block;font-size:10px;letter-spacing:2px;color:#8a7550;margin-top:2px}
  .dock-btn:active{transform:scale(.97)}
  .dock-btn svg{pointer-events:none}

  .presence{position:fixed;left:24px;bottom:20px;z-index:20;font-size:12px;letter-spacing:2px;
    color:#544a39;opacity:.9;pointer-events:none;
    background-image:var(--paper-tex);background-color:rgba(239,230,209,.88);
    border:1px solid rgba(120,96,58,.4);border-radius:14px;padding:5px 11px;
    box-shadow:0 4px 14px rgba(18,24,20,.2);
    display:flex;align-items:center;gap:8px}
  .presence::before{content:'';width:6px;height:6px;border-radius:50%;background:#c9d6a6;
    box-shadow:0 0 8px 2px rgba(201,214,166,.7);animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  .toast{position:fixed;left:50%;top:28px;z-index:40;transform:translateX(-50%) translateY(-14px);
    background-image:var(--paper-tex);background-color:rgba(239,230,209,.95);
    color:#6b4a22;border:1px solid var(--gold);border-radius:3px;
    padding:8px 22px;font-size:14px;letter-spacing:3px;
    box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 0 0 3px rgba(255,255,255,.3);
    opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #hoverTip{position:fixed;z-index:30;pointer-events:none;opacity:0;transform:translate(-50%,-155%) scale(.94);
    background-image:var(--paper-tex);background-color:rgba(240,231,211,.96);
    border:1px solid var(--gold);border-radius:3px;color:var(--ink);
    padding:7px 15px;font-size:13px;letter-spacing:2px;white-space:nowrap;
    box-shadow:0 8px 20px rgba(0,0,0,.3),inset 0 0 0 3px rgba(255,255,255,.35);
    transition:opacity .18s,transform .18s}
  #hoverTip.show{opacity:1;transform:translate(-50%,-150%) scale(1)}
  #hoverTip::after{content:'';position:absolute;left:50%;bottom:-6px;width:9px;height:9px;
    transform:translateX(-50%) rotate(45deg);background:#efe6ce;
    border-right:1px solid var(--gold);border-bottom:1px solid var(--gold)}
  #hoverTip .k{color:#7b4f22}
  #hoverTip .d{opacity:.6;font-size:11px;margin-left:9px;color:#8a6a3e}

  /* 头顶法号：别人淡墨、自己朱金 */
  .pname{position:absolute;transform:translate(-50%,-100%);font-size:12px;color:#f4ead4;
    text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6);
    white-space:nowrap;letter-spacing:2px;padding:2px 9px;border-radius:12px;
    background:rgba(28,32,30,.42);border:1px solid rgba(230,215,180,.22)}
  .selfname{position:absolute;transform:translate(-50%,-100%);font-size:13px;color:#fff0cf;
    text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;letter-spacing:3px;
    padding:3px 12px;border-radius:12px;background:rgba(168,67,58,.78);
    border:1px solid rgba(240,205,135,.75);box-shadow:0 0 14px rgba(201,160,82,.4);
    animation:floatName 3.4s ease-in-out infinite}
  .selfname::after{content:'';position:absolute;left:50%;bottom:-5px;width:7px;height:7px;
    transform:translateX(-50%) rotate(45deg);background:rgba(168,67,58,.78);
    border-right:1px solid rgba(240,205,135,.75);border-bottom:1px solid rgba(240,205,135,.75)}
  @keyframes floatName{0%,100%{margin-top:0}50%{margin-top:-3px}}

  /* ---------------- 进庙赐名卷轴 ---------------- */
  #entry{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%,rgba(38,42,38,.34),rgba(20,24,22,.66));
    backdrop-filter:blur(3px);cursor:pointer}
  #entry.show{display:flex}
  .scroll{position:relative;width:min(86vw,430px);padding:0 0 6px;
    animation:scrollIn .85s cubic-bezier(.18,.9,.3,1) both}
  @keyframes scrollIn{from{opacity:0;transform:scaleY(.5) translateY(24px)}
    to{opacity:1;transform:none}}
  .scroll .rod{height:16px;border-radius:9px;
    background:linear-gradient(#8a6238,#c99a5c 38%,#6d4a28 78%,#4a3018);
    box-shadow:0 4px 14px rgba(0,0,0,.5);position:relative}
  .scroll .rod::before,.scroll .rod::after{content:'';position:absolute;top:-3px;width:15px;height:22px;
    border-radius:4px;background:linear-gradient(#d7ad6d,#6d4a28)}
  .scroll .rod::before{left:-9px}.scroll .rod::after{right:-9px}
  .scroll .sheet{position:relative;margin:0 12px;padding:30px 26px 64px;text-align:center;color:var(--ink);
    background-image:var(--paper-tex);background-color:#f0e5cc;
    border-left:1px solid rgba(120,96,58,.4);border-right:1px solid rgba(120,96,58,.4);
    box-shadow:inset 0 0 46px rgba(160,126,72,.18),0 16px 40px rgba(0,0,0,.4)}
  .scroll .eyebrow{font-size:12px;letter-spacing:7px;color:#8a7550;margin-bottom:16px}
  .scroll .given{font-size:14px;letter-spacing:5px;color:#6d5a3c;margin-bottom:8px}
  .scroll .name{font-size:52px;letter-spacing:14px;line-height:1.25;color:#2e2b26;
    text-indent:14px;text-shadow:0 2px 0 rgba(255,255,255,.45);
    animation:nameIn 1.1s .25s cubic-bezier(.2,.9,.3,1) both}
  @keyframes nameIn{from{opacity:0;letter-spacing:32px;filter:blur(6px)}
    to{opacity:1;letter-spacing:14px;filter:blur(0)}}
  .scroll .divider{height:1px;margin:20px 30px;
    background:linear-gradient(90deg,transparent,rgba(120,96,58,.6),transparent)}
  .scroll .wish{font-size:13px;letter-spacing:3px;color:#6d5a3c;line-height:2}
  .scroll .stamp{position:absolute;right:18px;bottom:16px;width:46px;height:46px;
    transform:rotate(-8deg);border:2px solid var(--cinnabar);border-radius:3px;
    color:var(--cinnabar);font-size:11px;line-height:1.3;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;text-align:center;opacity:.82;
    animation:stampIn .5s .85s both}
  @keyframes stampIn{from{opacity:0;transform:rotate(-8deg) scale(2.2)}to{opacity:.82;transform:rotate(-8deg) scale(1)}}
  .scroll .close-hint{margin-top:14px;font-size:11px;letter-spacing:3px;color:#cfc0a2;
    animation:breathe 2.4s ease-in-out infinite;text-align:center}

  /* ---------------- 独立放大界面（木鱼/念珠/上香/撸猫/点灯） ---------------- */
  #focus{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 42%,rgba(92,98,88,.74),rgba(26,32,30,.94));
    backdrop-filter:blur(12px)}
  #focus.show{display:flex;animation:focusIn .42s ease both}
  @keyframes focusIn{from{opacity:0}to{opacity:1}}
  #focus::before{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:var(--paper-tex);background-size:240px;
    mix-blend-mode:soft-light;opacity:.12}
  #focus::after{content:'';position:absolute;left:50%;top:46%;width:70vmin;height:70vmin;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(226,186,112,.16),transparent 68%)}
  #focus .close{position:absolute;right:26px;top:22px;font:inherit;font-size:12px;letter-spacing:3px;
    color:#f0e2c4;cursor:pointer;background:rgba(30,34,32,.5);
    border:1px solid rgba(201,160,82,.5);border-radius:20px;padding:8px 18px;z-index:8;
    transition:all .2s}
  #focus .close:hover{border-color:var(--gold-lt);background:rgba(168,67,58,.7)}
  #focus .count{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);
    font-size:13px;opacity:.72;letter-spacing:4px;pointer-events:none;white-space:nowrap;
    color:var(--gold-lt);text-shadow:0 2px 8px rgba(0,0,0,.7)}
  #focus .obj{position:relative;width:min(58vmin,430px);height:min(58vmin,430px);cursor:pointer;touch-action:none;
    display:flex;align-items:center;justify-content:center;z-index:2;
    animation:objIn .5s cubic-bezier(.2,1.3,.4,1) both;
    transition:transform .14s cubic-bezier(.2,1.5,.5,1)}
  @keyframes objIn{from{opacity:0;transform:scale(.82) translateY(22px)}to{opacity:1;transform:none}}
  #focus.wide .obj{width:min(88vw,780px);height:min(70vh,520px);cursor:default}
  #focus .obj.press{transform:scale(.9) translateY(14px)}
  #focus .obj.bounce{transform:scale(1.05) translateY(-12px)}

  /* ---- 木鱼 ---- */
  .woodfish{width:78%;height:60%;position:relative;
    border-radius:50% 50% 47% 47% / 60% 60% 40% 40%;
    background:radial-gradient(ellipse at 34% 24%,#b5814a,#6a4526 54%,#2e1d0d);
    box-shadow:inset -16px -20px 34px rgba(0,0,0,.5),0 26px 46px rgba(0,0,0,.55),
      0 0 90px rgba(212,175,55,.18)}
  .woodfish::before{content:'';position:absolute;left:11%;right:11%;top:45%;height:15%;
    border-radius:50%;background:linear-gradient(#201206,#4a3018);
    box-shadow:inset 0 4px 8px rgba(0,0,0,.85),0 1px 0 rgba(255,220,160,.14)}
  .woodfish::after{content:'';position:absolute;left:23%;top:11%;width:34%;height:15%;
    border-radius:50%;background:rgba(255,236,192,.18);filter:blur(7px)}
  .mallet{position:absolute;left:66%;top:33%;width:15%;height:96%;
    transform-origin:88% 100%;transform:rotate(14deg);
    transition:transform .12s cubic-bezier(.3,.9,.4,1);pointer-events:none;z-index:6}
  .mallet.hit{transform:rotate(-14deg) translateY(2%);transition-duration:.085s}
  .mallet .stick{position:absolute;left:37%;top:13%;width:26%;height:100%;border-radius:10px;
    background:linear-gradient(90deg,#5a3620,#d4a262 38%,#8a5528 72%,#452a14);
    box-shadow:0 6px 16px rgba(0,0,0,.55),inset 1px 0 0 rgba(255,225,170,.22)}
  .mallet .knob{position:absolute;left:2%;top:0;width:96%;height:17%;border-radius:48% 48% 44% 44%;
    background:radial-gradient(circle at 34% 26%,#e7ba7c,#96602e 60%,#3f250e);
    box-shadow:inset -3px -5px 9px rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.55)}
  .mallet .knob::after{content:'';position:absolute;inset:-30%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,224,150,.75),rgba(255,224,150,0) 65%);
    opacity:0;transition:opacity .1s}
  .mallet.hit .knob::after{opacity:1}
  .spark{position:absolute;left:50%;top:43%;width:8px;height:8px;border-radius:50%;
    background:#ffe6a8;box-shadow:0 0 18px 6px rgba(255,214,130,.8);
    transform:translate(-50%,-50%);pointer-events:none;animation:spark .35s ease-out forwards}
  @keyframes spark{from{opacity:1;transform:translate(-50%,-50%) scale(.5)}
    to{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}

  /* ---- 念珠 ---- */
  #focus.beads-big .obj{width:min(76vmin,580px);height:min(76vmin,580px)}
  .beads{width:100%;height:100%;position:relative}
  .beads::before{content:'';position:absolute;left:50%;top:5%;width:42%;height:90%;
    transform:translateX(-50%);border:2px dashed rgba(190,145,85,.3);
    border-radius:50%;pointer-events:none}
  .bead{position:absolute;width:15%;height:15%;border-radius:50%;
    background:radial-gradient(circle at 32% 26%,#d79a56,#7d4a22 62%,#38200e);
    box-shadow:inset -2px -3px 6px rgba(0,0,0,.45),0 4px 9px rgba(0,0,0,.45);
    transition:left .16s ease-out,top .16s ease-out,transform .16s ease-out,
      opacity .16s ease-out,box-shadow .18s,filter .18s}
  .bead::after{content:'';position:absolute;left:43%;top:43%;width:14%;height:14%;
    border-radius:50%;background:rgba(28,15,6,.75)}
  .bead.on{box-shadow:0 0 28px rgba(255,214,120,.95),inset -2px -3px 5px rgba(0,0,0,.35);
    filter:brightness(1.35)}
  .bead.tassel{background:radial-gradient(circle at 32% 26%,#e6c079,#a8762f 60%,#5a3a12)}
  .bead-hint{position:absolute;right:0;top:50%;transform:translateY(-50%);
    font-size:24px;line-height:2;color:rgba(212,175,55,.55);pointer-events:none;
    transition:opacity .6s;text-shadow:0 0 10px rgba(212,175,55,.25)}
  .bead-hint.hide{opacity:0}
  .ripple{position:absolute;left:50%;top:50%;border:2px solid rgba(212,175,55,.55);
    border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
    animation:rip .75s ease-out forwards}
  @keyframes rip{from{width:18%;height:18%;opacity:.85}to{width:150%;height:150%;opacity:0}}

  /* ---- 上香 ---- */
  .incense-stage{position:relative;width:100%;height:100%}
  .i-item{position:absolute;cursor:pointer;transition:transform .2s,filter .2s}
  .i-item:hover{transform:translateY(-5px) scale(1.04);filter:drop-shadow(0 0 14px rgba(255,205,110,.75))}
  .i-item .tag{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);
    font-size:12px;letter-spacing:2px;color:rgba(232,207,148,.9);white-space:nowrap;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .i-item:hover .tag{opacity:1}
  .i-item.active{filter:drop-shadow(0 0 20px rgba(255,205,110,.9))}
  .i-holder{left:8%;bottom:16%;width:15%;height:34%}
  .i-holder .tube{position:absolute;inset:0;border-radius:8px 8px 14px 14px;
    background:linear-gradient(100deg,#6d4a2a,#a87848 45%,#4d3220);
    box-shadow:inset -8px 0 14px rgba(0,0,0,.5),0 14px 24px rgba(0,0,0,.5)}
  .i-holder .tube::before{content:'';position:absolute;left:-6%;right:-6%;top:-7%;height:16%;
    border-radius:50%;background:linear-gradient(#c79a5f,#7d5730)}
  .i-holder i{position:absolute;bottom:52%;width:5px;height:56%;border-radius:3px;
    background:linear-gradient(#c88b52,#7a4a25);transform-origin:50% 100%}
  .i-holder i:nth-child(1){left:34%;transform:rotate(-9deg)}
  .i-holder i:nth-child(2){left:52%;transform:rotate(1deg)}
  .i-holder i:nth-child(3){left:70%;transform:rotate(10deg)}
  .i-holder.done{filter:grayscale(.72) brightness(.7);cursor:default;pointer-events:none}
  .i-holder.done .tag{opacity:0}
  .i-holder.done::after{content:'已满';position:absolute;left:50%;top:-28px;transform:translateX(-50%);
    font-size:11px;letter-spacing:2px;color:rgba(232,207,148,.75);white-space:nowrap}
  .i-candle{right:9%;bottom:19%;width:12%;height:32%;display:flex;align-items:flex-end;justify-content:center}
  .i-candle .wax{position:absolute;bottom:0;width:44%;height:66%;border-radius:6px 6px 4px 4px;
    background:linear-gradient(90deg,#c9a06a,#f2ddb4 45%,#b08a58);
    box-shadow:0 10px 20px rgba(0,0,0,.45)}
  .i-candle .flame{position:absolute;bottom:62%;width:22%;height:26%;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
    background:radial-gradient(circle at 50% 70%,#fff2c0,#ffb43e 45%,rgba(255,120,20,.1) 78%);
    box-shadow:0 0 28px 10px rgba(255,168,60,.5);animation:flick 1.3s ease-in-out infinite alternate}
  @keyframes flick{from{transform:scale(.92) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
  .i-bowl{left:50%;bottom:12%;transform:translateX(-50%);width:36%;height:46%}
  .i-bowl:hover{transform:translateX(-50%) translateY(-5px) scale(1.03)}
  .i-bowl .ash{position:absolute;left:6%;right:6%;top:0;height:22%;border-radius:50%;
    background:radial-gradient(ellipse at 50% 30%,#9a8b74,#4b4034 70%);
    box-shadow:inset 0 6px 12px rgba(0,0,0,.6)}
  .i-bowl .body{position:absolute;left:2%;right:2%;top:12%;height:56%;
    border-radius:16% 16% 42% 42%/10% 10% 60% 60%;
    background:linear-gradient(100deg,#4a4034,#8a7554 38%,#b49a6e 52%,#5d5040 78%,#332c24);

    .tools button{height:34px;padding:0 9px;font-size:10px;letter-spacing:1px;border-radius:17px}

    .dock-btn .lbl{font-size:12px;letter-spacing:1px}.dock-btn .sub{font-size:9px;letter-spacing:1px}
    .presence{left:10px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:9px;letter-spacing:1px;padding:4px 8px;max-width:none;white-space:nowrap}
    .toast{top:100px;font-size:12px;letter-spacing:2px;padding:6px 14px;max-width:86vw;white-space:normal;text-align:center}
    .scroll{width:min(92vw,430px)}

  /* ---- 手机横屏：HUD 收窄、工具坞压缩、面板按可用高度走 ---- */
  @media (max-height:480px) and (orientation:landscape){
    .hud{left:8px;top:8px;width:148px;padding:5px 8px}

    .coin-scene,.lamp-stage,.incense-stage,.cat-stage{width:100%;height:100%}
  }
  @media (hover:none){#hoverTip{display:none!important}}

  /* ---- 放大面板：主体换成与 3D 场景同源的离屏渲染图 ---- */
  .prop-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;
    filter:drop-shadow(0 14px 26px rgba(14,18,16,.42))}
  .sprite-mode .woodfish{background:none;box-shadow:none;border-radius:0;width:92%;height:70%}
  .sprite-mode .mallet{left:60%;top:22%;width:34%;height:72%}
  .sprite-mode .prop-fish,.sprite-mode .prop-mallet,.sprite-mode .prop-lamp,.sprite-mode .prop-cat{transform:scale(1.14)}

  .sprite-mode .woodfish::before,.sprite-mode .woodfish::after{display:none}
  .sprite-mode .mallet .stick,.sprite-mode .mallet .knob{display:none}
  .sprite-mode .bead{background-color:transparent;box-shadow:none;border:0;border-radius:0}
  .sprite-mode .lamp-bowl,.sprite-mode .lamp-oil,.sprite-mode .lamp-stem,.sprite-mode .lamp-foot,
  .sprite-mode .lamp-wick::before,
  .sprite-mode .cat-body,.sprite-mode .cat-head,.sprite-mode .cat-paw,.sprite-mode .cat-tail,.sprite-mode .cat-purr,
  .sprite-mode .toad-body,.sprite-mode .toad-head,.sprite-mode .toad-eye,.sprite-mode .toad-leg,
  .sprite-mode .i-holder .tube,.sprite-mode .i-holder i,
  .sprite-mode .i-candle .wax,.sprite-mode .i-bowl .body,.sprite-mode .i-bowl .ash,
  .sprite-mode .i-bowl .ear,.sprite-mode .i-bowl .legs{visibility:hidden}

  .sprite-mode .toad-mouth .toad-coin{visibility:hidden}
  .sprite-mode .cat-stage.petting .prop-cat{animation:propPurr .55s ease-in-out infinite alternate}
  @keyframes propPurr{from{transform:scale(1) rotate(-1deg)}to{transform:scale(1.025) rotate(1deg)}}
</style>

<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div id="labels"></div>
</div>
<div class="grain"></div>
<div class="vignette"></div>
<div id="veil"></div>

<div class="hud">
  <div class="dharma-row">
    <div class="seal">静照<br>院</div>
    <div class="dharma-txt"><small>今 日 法 号</small><b id="dharmaName" class="dharma-wait">···</b></div>
  </div>
  <div class="stats">
    <div class="stat"><span>修行时长</span><b id="sessionTime">00:00</b></div>
    <div class="stat"><span>功德</span><b id="merit">0</b></div>
    <div class="stat"><span>今日修行</span><b id="todayTime">00:00</b></div>
  </div>
</div>

<div class="tools">
  <button type="button" id="mute" title="声音">🔊 声音</button>
  <button type="button" id="reset" title="重置记录">重置</button>
</div>

<!-- 木鱼与念珠：不再散落在院子边角，固定在这里，随时点开 -->
<div class="dock" id="dock">
  <button type="button" class="dock-btn" id="dockFish" title="敲木鱼">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4.5 20.2c0-6.2 5.1-10.4 11.5-10.4s11.5 4 11.5 9.2-5.1 9.4-11.5 9.4-11.5-2.2-11.5-8.2z"
        fill="#8a5a2c" stroke="#5a3616" stroke-width="1.4"/>
      <path d="M8.6 20.6h14.6" stroke="#2b1a09" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M8.4 13.2c2.6-2.2 6.4-3 10.2-2.4" stroke="#5f3c1c" stroke-width="1.3" fill="none" opacity=".7"/>
      <path d="M22.4 3.6l3.8 6.6" stroke="#7a4a22" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="26.8" cy="11.4" r="3.1" fill="#a8712f" stroke="#5a3616" stroke-width="1.2"/>
    </svg>
    <span><b class="lbl">木鱼</b><span class="sub">敲一敲</span></span>
  </button>
  <button type="button" class="dock-btn" id="dockBeads" title="拨念珠">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#7a4a22" stroke-width="1" opacity=".45"/>
      <g fill="#a8653a" stroke="#5a3616" stroke-width=".9">
        <circle cx="16" cy="6" r="2.7"/><circle cx="23.1" cy="8.9" r="2.7"/>
        <circle cx="26" cy="16" r="2.7"/><circle cx="23.1" cy="23.1" r="2.7"/>
        <circle cx="16" cy="26" r="2.7"/><circle cx="8.9" cy="23.1" r="2.7"/>
        <circle cx="6" cy="16" r="2.7"/><circle cx="8.9" cy="8.9" r="2.7"/>
      </g>
      <path d="M16 28.6v2.6" stroke="#a8433a" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <span><b class="lbl">念珠</b><span class="sub">拨一拨</span></span>
  </button>
</div>

<div class="presence" id="presence">连接中…</div>
<div id="fullGate"><div class="card"><b>庙中已满</b><span id="fullMsg">此刻已有 50 位同修在殿内，稍后再来吧</span><small>会自动再试一次 · 清静无需抢</small></div></div>
<div class="toast" id="toast"></div>
<div id="hoverTip"><span class="k"></span><span class="d"></span></div>

<div id="entry"><div class="scroll">
  <div class="rod"></div>
  <div class="sheet">
    <div class="eyebrow">静 照 院</div>
    <div class="given">山门已开 · 赐你法号</div>
    <div class="name" id="entryName">···</div>
    <div class="divider"></div>
    <div class="wish">愿此处清静，与你同在<br>可与同修共坐，亦可独自听风</div>
    <div class="stamp">静照<br>院</div>
  </div>
  <div class="rod"></div>
  <div class="close-hint">轻点任意处入庙</div>
</div></div>

<div id="focus">
  <button type="button" class="close" id="focusClose">× 收起</button>
  <div class="obj" id="focusObj"></div>
  <div class="count" id="focusCount"></div>
</div>

<script>
/* 启动兜底：直接双击打开(file://)会白屏，改成明确的引导；模块加载失败也给提示 */
(function () {
  function fatal(title, body) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#20262a;color:#f2e8d2;' +
      'display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;' +
      'font-family:"Kaiti SC","KaiTi","SimSun",serif;line-height:2;';
    d.innerHTML = '<div style="max-width:540px">' +
      '<div style="font-size:26px;letter-spacing:6px;color:#c9a052;margin-bottom:16px">' + title + '</div>' +
      '<div style="font-size:14px;opacity:.88">' + body + '</div></div>';
    document.body.appendChild(d);
  }
  if (location.protocol === 'file:') {
    fatal('请从本地服务进入', '这个小院用了 3D 模块，浏览器不允许直接双击 html 打开。<br><br>' +
      '最简单：<b>双击项目里的 start.bat</b>，它会自动启动服务并打开网页。<br><br>' +
      '也可以手动在 zen-court 目录执行 <code>node server.js</code>，再访问 <code>http://localhost:8787</code>。');
    return;
  }
  setTimeout(function () {
    if (!window.__zenReady) {
      fatal('小院没能打开', (window.__zenError ? '报错：' + window.__zenError + '<br><br>' : '') +
        '请确认服务已启动、且是通过 <code>http://localhost:8787</code> 访问。<br>' +
        '若仍打不开，按 F12 打开控制台，把红色报错发我即可。');
    }
  }, 4000);
})();
</script>
<script type="module" src="game.js?v=48"></script>
